name: Update SSTP node list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-sstp-node-list
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the SSTP node list
        run: python vpngate.py

      - name: Commit updated node list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/sstp-nodes.txt
          if git diff --cached --quiet; then
            echo "The SSTP node list has not changed."
            exit 0
          fi
          git commit -m "Update generated SSTP node list"
          git push
